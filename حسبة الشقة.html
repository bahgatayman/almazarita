<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسبة الشقة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f4;--card:#fcfdfc;--ink:#24322e;--mute:#6a7a75;--line:#e3e9e6;--acc:#2f7f79;--accbg:#e6f1ef;--warn:#b5532a;--ok:#2e7d4f;--bt:#fff;--sh:0 1px 2px rgba(36,50,46,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131b19;--card:#1b2623;--ink:#e4ece9;--mute:#96a8a2;--line:#2b3935;--acc:#6cc4bb;--accbg:#213a36;--warn:#f0a070;--ok:#7ad39b;--bt:#0d1f1c;--sh:none}}
:root[data-theme="dark"]{--bg:#131b19;--card:#1b2623;--ink:#e4ece9;--mute:#96a8a2;--line:#2b3935;--acc:#6cc4bb;--accbg:#213a36;--warn:#f0a070;--ok:#7ad39b;--bt:#0d1f1c;--sh:none}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;font-size:16px;line-height:1.7;padding-bottom:110px}
main{max-width:640px;margin:0 auto;padding:24px 16px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:28px;font-weight:800;margin:0;line-height:1.3}
.sub{color:var(--mute);margin:2px 0 0;font-size:15px}
.mon{display:flex;flex-direction:column;font-size:13px;color:var(--mute)}
.mon input{width:160px}
section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:20px;box-shadow:var(--sh)}
h2{display:flex;align-items:center;font-size:18px;font-weight:800;margin:0 0 14px}
.st{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accbg);color:var(--acc);font-size:14px;margin-inline-end:10px}
input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid transparent;border-radius:12px;padding:10px 12px;min-width:0}
input:focus,select:focus{border-color:var(--acc);outline:0}
button:focus-visible,summary:focus-visible,a.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button,a.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 18px;background:var(--acc);color:var(--bt);font-weight:600;text-decoration:none;display:inline-block}
button:active{opacity:.85}
button.g{background:var(--bg);color:var(--mute);padding:8px 14px;font-size:14px}
button.x{background:transparent;color:var(--mute);padding:2px 10px;font-size:20px;line-height:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:flex;align-items:center;background:var(--accbg);color:var(--acc);border-radius:99px;padding:2px 4px 2px 16px;font-weight:600}
.exp{background:var(--bg);border-radius:16px;padding:16px;margin-bottom:14px}
.exp .top{display:flex;gap:8px;align-items:center}
.exp .top .nm{flex:1;font-weight:800;font-size:17px;background:var(--card)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;gap:3px;margin-top:12px}
.seg button{flex:1;background:transparent;color:var(--mute);padding:8px 6px;font-size:14px}
.seg button.on{background:var(--accbg);color:var(--acc)}
.lbl{font-size:14px;color:var(--mute);margin:14px 0 8px}
.pay{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.pay select{flex:1}.pay .am{width:120px}
.pay select,.pay .am,.pamt{background:var(--card)}
.who{display:flex;flex-wrap:wrap;gap:8px}
.pw{display:flex;align-items:center;gap:4px}
.pw label{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer;user-select:none;font-size:15px;color:var(--mute)}
.pw label:has(input:checked){background:var(--accbg);color:var(--acc);font-weight:600}
.pw input[type=checkbox]{accent-color:var(--acc)}
.pw input.w{width:52px;padding:5px 4px;text-align:center;background:var(--card)}
.pamt{width:160px}
.sub2{display:flex;justify-content:space-between;margin-top:14px;color:var(--mute);font-size:15px}
.sub2 span:last-child{color:var(--ink);font-weight:800}
.hint{font-size:14px;color:var(--mute);margin:4px 0 0}
.res{display:grid;gap:12px}
.person{background:var(--bg);border-radius:16px;padding:16px}
.person .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.person .n{font-weight:800;font-size:19px}
.person .t{font-weight:800;font-size:22px;color:var(--acc);font-variant-numeric:tabular-nums}
.t.pos{color:var(--ok)}
.person .m{color:var(--mute);font-size:14px}
.poolline{display:flex;justify-content:space-between;margin-top:8px;padding:8px 12px;background:var(--card);border-radius:10px;font-size:15px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--mute);font-size:14px}
.person ul{list-style:none;margin:6px 0 0;padding:0;color:var(--mute);font-size:14px}
.person li{display:flex;justify-content:space-between;padding:1px 0}
.tot{display:flex;justify-content:space-between;font-weight:800;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.warn{color:var(--warn);font-size:14px;margin-top:8px}
.empty{color:var(--mute);padding:8px 0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.bl{font-size:12px;color:var(--mute);line-height:1.2}.bv{font-weight:800;font-size:20px;line-height:1.3}
.modal{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.mbox{background:var(--card);border-radius:20px;padding:16px;max-width:560px;width:100%;max-height:100%;overflow:auto;text-align:center}
.mbox img{width:100%;height:auto;border-radius:12px}
.mbox .row{justify-content:center;margin-top:14px}
</style>
</head>
<body>
<main>
  <header class="hero">
    <div><h1>حسبة الشقة</h1><p class="sub">ضيف الأسامي والمصاريف، وشوف كل واحد هيدفع كام.</p></div>
    <label class="mon">الشهر<input type="text" id="month" placeholder="مثلاً أكتوبر 2026"></label>
  </header>

  <section>
    <h2><span class="st">1</span>مين ساكن؟</h2>
    <div class="row">
      <input type="text" id="pname" placeholder="اسم الشخص" aria-label="اسم الشخص">
      <button id="addP">ضيف شخص</button>
    </div>
    <div class="chips" id="people"></div>
  </section>

  <section>
    <h2><span class="st">2</span>المصاريف</h2>
    <p class="hint" style="margin-bottom:12px">اختار نوع كل مصروف وعلّم اللي بيشارك فيه. الرقم الصغير جنب الاسم هو عدد الأنفار.</p>
    <div id="exps"></div>
    <div class="row">
      <button id="addE">ضيف مصروف</button>
      <button class="g" id="reset">ابدأ من جديد</button>
    </div>
  </section>

  <section>
    <h2><span class="st">3</span>النتيجة</h2>
    <div class="res" id="res"></div>
    <div id="settle"></div>
    <div id="totbox"></div>
    <div class="row" style="margin-top:14px"><button id="exportBtn">طلّع صورة</button><button class="g" id="copy">انسخ كنص</button><span id="cmsg" class="hint"></span></div>
  </section>
</main>

<div class="bar"><div><div class="bl">إجمالي المصاريف</div><div class="bv" id="barTotal">0</div></div><button id="exportBtn2">طلّع صورة للجروب</button></div>

<div class="modal" id="modal" hidden role="dialog" aria-label="صورة الحسبة"><div class="mbox">
  <img id="mimg" alt="صورة حسبة الشقة">
  <div class="row"><a id="mdl" class="btn" download="apartment-split.png">نزّل الصورة</a><button class="g" id="mclose">قفل</button></div>
  <p class="hint">لو التحميل مش شغال، اضغط مطوّلاً على الصورة واحفظها.</p>
</div></div>


<script>
(function(){
  var KEY="apartment-split-v2";
  var uid=function(){return Math.random().toString(36).slice(2,9)};
  var state;
  function mkExp(name,people,w,pool){return {id:uid(),name:name,pool:!!pool,amt:"",pays:[{id:uid(),who:"",amt:""}],who:people.map(function(p){return p.id}),w:w||{}}}
  function defMonth(){try{return new Date().toLocaleDateString("ar-EG",{month:"long",year:"numeric"})}catch(e){return ""}}
  function def(){
    var ps=[{id:uid(),name:"بهجت"},{id:uid(),name:"صاحب 2"},{id:uid(),name:"صاحب 3"}];
    var w={};w[ps[0].id]=2;
    return {month:defMonth(),people:ps,expenses:[mkExp("الإيجار",ps,w,true),mkExp("الكهربا",ps),mkExp("المياه",ps),mkExp("النت",ps)]};
  }
  try{var s=localStorage.getItem(KEY);state=s?JSON.parse(s):def()}catch(e){state=def()}
  if(!state||!state.people||!state.expenses)state=def();
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
  var $=function(id){return document.getElementById(id)};
  var up=function(n){return Math.ceil(n-1e-6)};
  var fmt=function(n){return up(n).toLocaleString("en-US")};
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function E(id){return state.expenses.filter(function(e){return e.id===id})[0]}
  function nm(id){var p=state.people.filter(function(x){return x.id===id})[0];return p?p.name:"؟"}

  function renderPeople(){
    $("people").innerHTML=state.people.length?state.people.map(function(p){
      return '<span class="chip">'+esc(p.name)+'<button class="x" data-act="delP" data-p="'+p.id+'" aria-label="شيل '+esc(p.name)+'">×</button></span>';
    }).join(""):'<div class="empty">ضيف أول شخص.</div>';
  }
  function renderExps(){
    $("exps").innerHTML=state.expenses.length?state.expenses.map(function(e){
      var pays=e.pays.map(function(py){
        var opts='<option value="">مين دفع؟</option>'+state.people.map(function(p){return '<option value="'+p.id+'"'+(p.id===py.who?" selected":"")+'>'+esc(p.name)+'</option>'}).join("");
        return '<div class="pay"><select data-k="who" data-e="'+e.id+'" data-pay="'+py.id+'" aria-label="مين دفع">'+opts+'</select>'+
          '<input type="number" class="am" inputmode="decimal" min="0" step="any" data-k="amt" data-e="'+e.id+'" data-pay="'+py.id+'" value="'+esc(py.amt)+'" placeholder="المبلغ" aria-label="المبلغ">'+
          (e.pays.length>1?'<button class="x" data-act="delPay" data-e="'+e.id+'" data-pay="'+py.id+'" aria-label="امسح الدفعة">×</button>':'')+'</div>';
      }).join("");
      var who=state.people.map(function(p){
        var on=e.who.indexOf(p.id)>-1,w=e.w[p.id]||1;
        return '<span class="pw"><label><input type="checkbox" data-k="part" data-e="'+e.id+'" data-p="'+p.id+'"'+(on?" checked":"")+'>'+esc(p.name)+'</label>'+
          '<input type="number" class="w" inputmode="decimal" min="0.5" step="0.5" data-k="w" data-e="'+e.id+'" data-p="'+p.id+'" value="'+w+'" aria-label="عدد الأنفار"'+(on?"":" hidden")+'></span>';
      }).join("");
      var poolBox='<div class="seg" role="group" aria-label="نوع المصروف"><button type="button" class="'+(e.pool?"":"on")+'" data-act="setPool" data-e="'+e.id+'" data-v="0">حد دفعه من جيبه</button><button type="button" class="'+(e.pool?"on":"")+'" data-act="setPool" data-e="'+e.id+'" data-v="1">بيتلم من الكل</button></div>';
      var payBox='<div class="lbl">اتدفع بواسطة</div>'+pays+'<button class="g" data-act="addPay" data-e="'+e.id+'">+ دفعة تانية</button>';
      var poolAmt='<div class="lbl">المبلغ الكلي</div><input type="number" class="pamt" inputmode="decimal" min="0" step="any" data-k="pamt" data-e="'+e.id+'" value="'+esc(e.amt||"")+'" placeholder="المبلغ" aria-label="المبلغ الكلي">';
      return '<div class="exp"><div class="top"><input type="text" class="nm" data-k="name" data-e="'+e.id+'" value="'+esc(e.name)+'" placeholder="اسم المصروف" aria-label="اسم المصروف">'+
        '<button class="g" data-act="dupE" data-e="'+e.id+'">نسخ</button>'+
        '<button class="x" data-act="delE" data-e="'+e.id+'" aria-label="امسح المصروف">×</button></div>'+
        poolBox+(e.pool?poolAmt:payBox)+
        '<div class="lbl">بيتقسم على</div><div class="who">'+who+'</div>'+
        '<div class="sub2"><span>إجمالي المصروف</span><span data-sub="'+e.id+'">0</span></div></div>';
    }).join(""):'<div class="empty">ضيف أول مصروف: إيجار، كهربا، مياه، نت...</div>';
  }
  function calc(){
    var per={},total=0,subs={},noPayer=[],noPart=[];
    state.people.forEach(function(p){per[p.id]={owed:0,paid:0,bal:0,pool:0,items:[]}});
    state.expenses.forEach(function(e){
      var sum=0;
      if(e.pool){sum=parseFloat(e.amt)||0}
      else e.pays.forEach(function(py){var a=parseFloat(py.amt)||0;if(!a)return;sum+=a;if(per[py.who])per[py.who].paid+=a;else noPayer.push(e.name||"مصروف")});
      subs[e.id]=sum;if(!sum)return;
      var ws=e.who.filter(function(id){return per[id]});
      if(!ws.length){noPart.push(e.name||"مصروف");return}
      total+=sum;
      var wt=function(id){var w=parseFloat(e.w[id]);return w>0?w:1};
      var tw=ws.reduce(function(a,id){return a+wt(id)},0);
      ws.forEach(function(id){var v=sum*wt(id)/tw;if(e.pool)per[id].pool+=v;else per[id].owed+=v;per[id].items.push({n:e.name||"مصروف",v:v,pool:!!e.pool})});
    });
    var poolCollected=0;
    state.people.forEach(function(p){var d=per[p.id];d.bal=d.paid-d.owed;poolCollected+=up(d.pool)});
    var st=settle(per).map(function(t){return {from:t.from,to:t.to,v:up(t.v)}}).filter(function(t){return t.v>0});
    var net={};st.forEach(function(t){net[t.to]=(net[t.to]||0)+t.v;net[t.from]=(net[t.from]||0)-t.v});
    var pay={};state.people.forEach(function(p){pay[p.id]={pool:up(per[p.id].pool),out:[],inn:[]}});
    st.forEach(function(t){pay[t.from].out.push({to:t.to,v:t.v});pay[t.to].inn.push({from:t.from,v:t.v})});
    return {per:per,total:total,subs:subs,noPayer:noPayer,noPart:noPart,settle:st,net:net,poolCollected:poolCollected,pay:pay};
  }
  function settle(per){
    var cr=[],db=[],out=[],i=0,j=0;
    state.people.forEach(function(p){var b=per[p.id].bal;if(b>0.005)cr.push({id:p.id,v:b});else if(b<-0.005)db.push({id:p.id,v:-b})});
    cr.sort(function(a,b){return b.v-a.v});db.sort(function(a,b){return b.v-a.v});
    while(i<cr.length&&j<db.length){
      var m=Math.min(cr[i].v,db[j].v);
      if(m>0.005)out.push({from:db[j].id,to:cr[i].id,v:m});
      cr[i].v-=m;db[j].v-=m;
      if(cr[i].v<0.005)i++;if(db[j].v<0.005)j++;
    }
    return out;
  }
  function renderRes(){
    var r=calc();
    $("barTotal").textContent=fmt(r.total);
    Array.prototype.forEach.call(document.querySelectorAll("[data-sub]"),function(el){el.textContent=fmt(r.subs[el.getAttribute("data-sub")]||0)});
    $("res").innerHTML=state.people.length?state.people.map(function(p){
      var d=r.per[p.id],b=r.net[p.id]||0,hasBal=d.paid>0||d.owed>0||b!==0;
      var due=up(d.pool)-b;
      var head=due>0?'<span class="t">يدفع '+fmt(due)+'</span>':due<0?'<span class="t pos">ياخد '+fmt(-due)+'</span>':'<span class="t">متساوي</span>';
      return '<div class="person"><div class="h"><span class="n">'+esc(p.name)+'</span>'+head+'</div>'+
        (hasBal?'<div class="m">دفع '+fmt(d.paid)+' · نصيبه '+fmt(d.owed)+'</div>':'')+
        (d.pool>0?'<div class="poolline"><span>يحط في التجميعة</span><span>'+fmt(d.pool)+'</span></div>':'')+
        (d.items.length?'<details><summary>تفاصيل نصيبه</summary><ul>'+d.items.map(function(i){return '<li><span>'+esc(i.n)+(i.pool?' (تجميعة)':'')+'</span><span>'+fmt(i.v)+'</span></li>'}).join("")+'</ul></details>':'')+'</div>';
    }).join(""):'<div class="empty">ضيف ناس عشان تظهر الحسبة.</div>';
    $("settle").innerHTML="";
    var w="";
    if(r.noPayer.length)w+='<div class="warn">محدد مين دفع في: '+r.noPayer.filter(function(x,i,a){return a.indexOf(x)===i}).map(esc).join("، ")+' — اختار الشخص عشان يتحسب له، أو علّم المصروف إنه بيتلم من الكل.</div>';
    if(r.noPart.length)w+='<div class="warn">مفيش حد مشترك في: '+r.noPart.map(esc).join("، ")+'.</div>';
    $("totbox").innerHTML=(r.poolCollected>0?'<div class="tot"><span>إجمالي التجميعة</span><span>'+fmt(r.poolCollected)+'</span></div>':'')+
      '<div class="tot"><span>إجمالي المصاريف</span><span>'+fmt(r.total)+'</span></div>'+w;
    save();
  }
  function renderAll(){renderPeople();renderExps();renderRes()}

  function addPerson(){
    var v=$("pname").value.trim();if(!v)return;
    var p={id:uid(),name:v};state.people.push(p);
    state.expenses.forEach(function(e){e.who.push(p.id)});
    $("pname").value="";renderAll();$("pname").focus();
  }
  $("addP").onclick=addPerson;
  $("pname").addEventListener("keydown",function(e){if(e.key==="Enter")addPerson()});
  $("addE").onclick=function(){
    state.expenses.push(mkExp("",state.people));
    renderAll();var els=document.querySelectorAll('[data-k="name"]');if(els.length)els[els.length-1].focus();
  };
  $("reset").onclick=function(){if(confirm("تمسح كل البيانات وتبدأ من جديد؟")){state=def();renderAll()}};

  document.addEventListener("click",function(ev){
    var b=ev.target.closest&&ev.target.closest("[data-act]");if(!b)return;
    var d=b.dataset,a=d.act,e=d.e?E(d.e):null;
    if(a==="delP"){
      state.people=state.people.filter(function(p){return p.id!==d.p});
      state.expenses.forEach(function(x){x.who=x.who.filter(function(i){return i!==d.p});x.pays.forEach(function(py){if(py.who===d.p)py.who=""})});
    }else if(a==="delE"){state.expenses=state.expenses.filter(function(x){return x.id!==d.e})}
    else if(a==="addPay"&&e){e.pays.push({id:uid(),who:"",amt:""})}
    else if(a==="delPay"&&e){e.pays=e.pays.filter(function(py){return py.id!==d.pay})}
    else if(a==="setPool"&&e){e.pool=d.v==="1"}
    else if(a==="dupE"&&e){state.expenses.splice(state.expenses.indexOf(e)+1,0,{id:uid(),name:(e.name||"")+" (2)",pool:e.pool,amt:"",pays:[{id:uid(),who:"",amt:""}],who:e.who.slice(),w:JSON.parse(JSON.stringify(e.w||{}))})}
    else return;
    renderAll();
  });
  function payOf(e,id){return e.pays.filter(function(py){return py.id===id})[0]}
  document.addEventListener("input",function(ev){
    var t=ev.target,d=t.dataset,e=d&&d.e?E(d.e):null;if(!e)return;
    if(d.k==="name")e.name=t.value;
    else if(d.k==="amt"){var py=payOf(e,d.pay);if(py)py.amt=t.value}
    else if(d.k==="pamt")e.amt=t.value;
    else if(d.k==="w")e.w[d.p]=t.value;
    else return;
    renderRes();
  });
  document.addEventListener("change",function(ev){
    var t=ev.target,d=t.dataset,e=d&&d.e?E(d.e):null;if(!e)return;
    if(d.k==="who"){var py=payOf(e,d.pay);if(py)py.who=t.value;renderRes()}
    else if(d.k==="pool"){e.pool=t.checked;renderExps();renderRes()}
    else if(d.k==="part"){
      e.who=e.who.filter(function(i){return i!==d.p});if(t.checked)e.who.push(d.p);
      renderExps();renderRes();
    }
  });
  $("copy").onclick=function(){
    var r=calc();
    var lines=["حسبة الشقة"+(state.month?" - "+state.month:"")].concat(state.people.map(function(p){var due=up(r.per[p.id].pool)-(r.net[p.id]||0);return p.name+": "+(due>0?"يدفع "+fmt(due):due<0?"ياخد "+fmt(-due):"متساوي")}));
    lines.push("","الإجمالي: "+fmt(r.total));
    function ok(){$("cmsg").textContent="اتنسخ";setTimeout(function(){$("cmsg").textContent=""},2000)}
    try{navigator.clipboard.writeText(lines.join("\n")).then(ok,function(){$("cmsg").textContent="النسخ مش شغال هنا"})}catch(e){$("cmsg").textContent="النسخ مش شغال هنا"}
  };
  function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
  function drawImage(r){
    var W=900,P=32,F="Cairo,Tahoma,Arial,sans-serif",N=function(v){return v.toLocaleString("en-US")};
    var rows=state.people.map(function(p){
      var d=r.pay[p.id],nt=r.net[p.id]||0,ls=[],tot=d.pool-nt;
      if(d.pool>0)ls.push({t:"في التجميعة",v:d.pool,k:"pay"});
      if(nt<0)ls.push({t:"فرق مصاريف الخدمات",v:-nt,k:"pay"});
      if(nt>0)ls.push({t:"خصم: دفع من جيبه",v:nt,k:"get"});
      return {name:p.name,ls:ls,pay:Math.max(0,tot),get:Math.max(0,-tot)};
    });
    var HH=150,GAP=14,H=HH+90+rows.reduce(function(a,x){return a+96+x.ls.length*38+GAP},0);
    var cv=document.createElement("canvas");cv.width=W*2;cv.height=H*2;
    var c=cv.getContext("2d");c.scale(2,2);c.direction="rtl";
    c.fillStyle="#f3f6f4";c.fillRect(0,0,W,H);
    var g=c.createLinearGradient(0,0,W,0);g.addColorStop(0,"#2f7f79");g.addColorStop(1,"#4a9a93");
    c.fillStyle=g;rr(c,P,P,W-2*P,108,22);c.fill();
    c.fillStyle="#fff";c.textAlign="right";c.font="800 44px "+F;c.fillText("حسبة الشقة",W-P-28,P+62);
    c.font="600 26px "+F;c.fillText(state.month||"",W-P-28,P+98);
    var y=HH;
    rows.forEach(function(x){
      var h=96+x.ls.length*38;
      c.fillStyle="#fff";rr(c,P,y,W-2*P,h,20);c.fill();c.strokeStyle="#dbe4e0";c.lineWidth=1.5;c.stroke();
      c.fillStyle="#12211d";c.textAlign="right";c.font="800 32px "+F;c.fillText(x.name,W-P-24,y+58);
      var big=x.pay>0?x.pay:x.get;
      c.textAlign="left";
      if(big>0){
        c.fillStyle=x.pay>0?"#2f7f79":"#2e7d4f";c.font="800 42px "+F;c.fillText(N(big),P+24,y+56);
        c.fillStyle="#5f726c";c.font="600 20px "+F;c.fillText((x.pay>0?"يدفع":"ياخد")+" جنيه",P+24,y+82);
      }else{c.fillStyle="#5f726c";c.font="600 24px "+F;c.fillText("مفيش عليه حاجة",P+24,y+58)}
      x.ls.forEach(function(l,i){
        var by=y+118+i*38;
        if(i===0){c.strokeStyle="#e6ecea";c.beginPath();c.moveTo(P+24,y+92);c.lineTo(W-P-24,y+92);c.stroke()}
        c.textAlign="right";c.font="600 22px "+F;c.fillStyle="#12211d";c.fillText(l.t,W-P-24,by);
        c.textAlign="left";c.font="800 22px "+F;c.fillStyle=l.k==="get"?"#2e7d4f":"#2f7f79";c.fillText((l.k==="get"?"-":"")+N(l.v),P+24,by);
      });
      y+=h+GAP;
    });
    c.textAlign="center";c.fillStyle="#5f726c";c.font="600 24px "+F;c.fillText("إجمالي المصاريف "+N(up(r.total))+" جنيه",W/2,y+34);
    return cv;
  }
  function exportImage(){
    var go=function(){var u=drawImage(calc()).toDataURL("image/png");$("mimg").src=u;$("mdl").href=u;$("modal").hidden=false;$("mclose").focus()};
    try{Promise.all([document.fonts.load("800 30px Cairo"),document.fonts.load("600 20px Cairo")]).then(go,go)}catch(e){go()}
  }
  $("exportBtn").onclick=exportImage;$("exportBtn2").onclick=exportImage;
  $("mclose").onclick=function(){$("modal").hidden=true};
  $("modal").addEventListener("click",function(e){if(e.target===this)this.hidden=true});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")$("modal").hidden=true});
  $("month").value=state.month||"";
  $("month").addEventListener("input",function(){state.month=this.value;save()});
  renderAll();
})();
</script>
</body>
</html>
